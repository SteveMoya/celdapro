<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="CeldaPro">
  <!-- Variante micro (16 px): a ese tamaño la celda y el anillo se funden en
       una mancha, así que se usa solo el rayo, grande, sobre el verde de marca.
       Es el icono de notificación y el favicon. -->
  <defs>
    <linearGradient id="cpBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#43A047"/>
      <stop offset="1" stop-color="#2E7D32"/>
    </linearGradient>
    <linearGradient id="cpBoltBig" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD54F"/>
      <stop offset="1" stop-color="#FFA000"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#cpBg)"/>
  <path d="M 330 92 L 168 288 L 244 288 L 200 420 L 356 226 L 280 226 Z"
        fill="url(#cpBoltBig)"/>
</svg>
