<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2E7D32"/><stop offset="1" stop-color="#1B5E20"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="256" fill="url(#bg)"/>
  <g transform="translate(256,256) scale(0.62) translate(-256,-256)">
    
  <defs>
    <linearGradient id="cpRing" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#1B5E20"/>
      <stop offset="1" stop-color="#43A047"/>
    </linearGradient>
    <linearGradient id="cpCell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#D8E9DC"/>
    </linearGradient>
    <linearGradient id="cpBolt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFC53D"/>
      <stop offset="1" stop-color="#FFA000"/>
    </linearGradient>
  </defs>

  <!-- Anillo abierto: el ciclo de restauración -->
  <path d="M 331 156 A 150 150 0 1 1 181 156"
        fill="none" stroke="url(#cpRing)" stroke-width="30" stroke-linecap="round"/>
  <!-- Punta de flecha: el ciclo avanza -->
  <path d="M 209 137 L 163 143 L 186 181 Z" fill="#2E7D32"/>

  <!-- Terminal positivo -->
  <rect x="228" y="150" width="56" height="54" rx="14" fill="#FFFFFF"/>
  <!-- Cuerpo de la celda (18650) -->
  <rect x="196" y="192" width="120" height="184" rx="30" fill="url(#cpCell)"/>
  <!-- Rayo: la energía recuperada -->
  <path d="M 278 226 L 220 298 L 248 298 L 234 356 L 294 280 L 264 280 Z" fill="url(#cpBolt)"/>

  </g>
</svg>